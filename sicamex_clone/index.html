<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICAMEX - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">SICAMEX</a>
            <nav>
                <ul>
                    <li><a href="index.html" class="active">Dashboard</a></li>
                    <li><a href="pages/productos.html">Productos</a></li>
                    <li><a href="pages/clientes.html">Clientes</a></li>
                    <li><a href="pages/entregas.html">Entregas</a></li>
                    <li><a href="pages/devoluciones.html">Devoluciones</a></li>
                    <li><a href="pages/indicadores.html">Indicadores</a></li>
                </ul>
            </nav>
            <button id="openCedisModal" class="btn btn-primary">Seleccionar CEDIS</button>
        </div>
    </header>

    <div class="main-container">
        <h1 class="mb-2">Dashboard General</h1>
        
        <!-- KPIs -->
        <div id="kpi-container" class="kpi-container">
            <!-- Se llena dinámicamente con JS -->
        </div>

        <!-- Gráfica de Ventas por Ruta -->
        <div class="chart-container">
            <canvas id="ventasChart"></canvas>
        </div>

        <!-- Últimas Entregas -->
        <div class="table-container">
            <div class="table-header">
                <h2>Últimas Entregas</h2>
                <button class="btn btn-success" onclick="exportToCSV('ultimas-entregas', 'ultimas_entregas.csv')">Exportar CSV</button>
            </div>
            <table id="ultimas-entregas">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Tienda</th>
                        <th>Cantidad</th>
                        <th>Total</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="ultimas-entregas-body">
                    <!-- Se llena dinámicamente con JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Selección CEDIS -->
    <div id="cedisModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Seleccionar CEDIS</h2>
                <button class="close-btn">&times;</button>
            </div>
            <div id="cedis-options">
                <!-- Se llena dinámicamente con JS -->
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" onclick="document.getElementById('cedisModal').classList.remove('active')">Cerrar</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 SICAMEX - Sistema de Control y Administración de Mercancías</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
