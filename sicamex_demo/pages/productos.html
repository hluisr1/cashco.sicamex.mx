<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - SICAMEX</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="header">
        <h1>📦 SICAMEX</h1>
        <div class="header-controls">
            <button class="cedis-selector" onclick="openCedisModal()">
                🏢 <span id="cedisDisplay">Todos los CEDIS</span>
            </button>
        </div>
    </header>

    <nav class="nav-container">
        <ul class="nav-menu">
            <li><a href="../index.html">Dashboard</a></li>
            <li><a href="productos.html" class="active">Productos</a></li>
            <li><a href="clientes.html">Clientes</a></li>
            <li><a href="entregas.html">Entregas</a></li>
            <li><a href="devoluciones.html">Devoluciones</a></li>
            <li><a href="indicadores.html">Indicadores</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <h2 class="page-title">Catálogo de Productos</h2>

        <div class="table-container">
            <div class="table-header">
                <h3 class="table-title">Listado de Productos</h3>
                <button class="btn btn-primary" onclick="exportTableToCSV('tablaProductos', 'productos.csv')">
                    📥 Exportar CSV
                </button>
            </div>
            <table id="tablaProductos">
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Valor Inventario</th>
                    </tr>
                </thead>
                <tbody id="productosBody">
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal CEDIS -->
    <div class="modal-overlay" id="cedisModal">
        <div class="modal">
            <h3 class="modal-title">Seleccionar CEDIS</h3>
            <div class="cedis-list" id="cedisListContainer"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeCedisModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        async function loadProductos() {
            const productos = dataManager.getProductos();
            const productosBody = document.getElementById('productosBody');
            
            productosBody.innerHTML = productos.map(producto => {
                const valorInventario = producto.precio * producto.stock;
                
                return `
                    <tr>
                        <td>${producto.sku}</td>
                        <td>${producto.nombre}</td>
                        <td>${producto.categoria}</td>
                        <td>${formatCurrency(producto.precio)}</td>
                        <td>${producto.stock.toLocaleString()}</td>
                        <td>${formatCurrency(valorInventario)}</td>
                    </tr>
                `;
            }).join('');
        }

        function refreshCurrentPage() {
            loadProductos();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await dataManager.loadData();
            loadProductos();
            initNavigation();
        });
    </script>
</body>
</html>
